<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deepu's Dreamy Homepage</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(
    135deg,
    #ffdde1,
    #ee9ca7,
    #c9d6ff,
    #e2e2e2
  );
  background-size:400% 400%;
  animation:skyFlow 15s ease infinite;
  color:white;
}

@keyframes skyFlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container{
  width:90%;
  max-width:750px;
  padding:40px;
  border-radius:30px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
  text-align:center;
  position:relative;
  z-index:10;
  animation:rgbGlow 6s linear infinite;
}

@keyframes rgbGlow{
  0%{
    box-shadow:0 0 25px #ff7eb3;
  }
  25%{
    box-shadow:0 0 25px #ffb6c1;
  }
  50%{
    box-shadow:0 0 25px #c9a0ff;
  }
  75%{
    box-shadow:0 0 25px #87cefa;
  }
  100%{
    box-shadow:0 0 25px #ff7eb3;
  }
}

#greeting{
  position:absolute;
  top:25px;
  left:25px;
  font-size:1.1rem;
  font-weight:bold;
  background:rgba(255,255,255,0.15);
  padding:12px 18px;
  border-radius:20px;
  backdrop-filter:blur(10px);
}

#time{
  font-size:4rem;
  font-weight:bold;
  margin-top:20px;
}

#date{
  margin-top:10px;
  opacity:0.9;
}

h1{
  font-size:3rem;
  margin-top:20px;
  margin-bottom:15px;
}

.quote{
  margin-top:20px;
  font-size:1.2rem;
  line-height:1.8;
}

.search-box{
  margin-top:30px;
}

.search-box input{
  width:80%;
  padding:16px;
  border:none;
  outline:none;
  border-radius:20px;
  background:rgba(255,255,255,0.18);
  color:white;
  font-size:1rem;
}

.search-box input::placeholder{
  color:white;
}

.links{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:16px;
}

.link-card{
  text-decoration:none;
  color:white;
  padding:18px;
  border-radius:18px;
  background:rgba(255,255,255,0.15);
  transition:0.3s;
}

.link-card:hover{
  transform:translateY(-5px) scale(1.05);
  background:rgba(255,255,255,0.3);
}

.heart{
  position:absolute;
  color:#ff4d88;
  font-size:20px;
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  0%{
    transform:translateY(100vh) scale(0.5);
    opacity:0;
  }
  10%{
    opacity:1;
  }
  100%{
    transform:translateY(-120vh) scale(1.2);
    opacity:0;
  }
}

.butterfly{
  position:absolute;
  font-size:24px;
  animation:fly 18s linear infinite;
  opacity:0.7;
}

@keyframes fly{
  0%{
    transform:translateX(-10vw) translateY(20vh);
  }
  50%{
    transform:translateX(50vw) translateY(-10vh);
  }
  100%{
    transform:translateX(110vw) translateY(30vh);
  }
}

</style>
</head>

<body>

<div id="greeting">Hey Deepu ✨</div>

<div class="container">

<h1>Deepu's Dream Space 🌸</h1>

<div id="time">00:00:00</div>

<div id="date">Loading...</div>

<div class="quote">
  “Hey Deepu, hope today becomes beautiful 💫”<br><br>

  “Reminder: You're awesome 🌸”<br><br>

  “Drink water & conquer the day 😌”
</div>

<div class="search-box">
  <input
    type="text"
    id="search"
    placeholder="Search something dreamy..."
  >
</div>

<div class="links">

  <a class="link-card"
     href="https://www.youtube.com"
     target="_blank">
     YouTube 🎬
  </a>

  <a class="link-card"
     href="https://open.spotify.com"
     target="_blank">
     Spotify 🎵
  </a>

  <a class="link-card"
     href="https://www.instagram.com"
     target="_blank">
     Instagram 📸
  </a>

  <a class="link-card"
     href="https://www.pinterest.com"
     target="_blank">
     Pinterest 🌷
  </a>

</div>

</div>

<script>

function updateTime(){

  const now = new Date();

  const time = now.toLocaleTimeString();

  const date = now.toLocaleDateString(undefined,{
    weekday:'long',
    year:'numeric',
    month:'long',
    day:'numeric'
  });

  document.getElementById('time').textContent = time;

  document.getElementById('date').textContent = date;
}

setInterval(updateTime,1000);

updateTime();

function updateGreeting(){

  const hour = new Date().getHours();

  let text = "";

  if(hour >= 5 && hour < 12){

    text = "Good Morning Deepu ☀️";

  }else if(hour >= 12 && hour < 17){

    text = "Good Afternoon Deepu 🌤️";

  }else if(hour >= 17 && hour < 21){

    text = "Good Evening Deepu 🌆";

  }else{

    text = "Hey Deepu, it's bedtime 🌙";
  }

  document.getElementById('greeting').textContent = text;
}

window.onload = function(){

  updateGreeting();

};

document.getElementById('search')
.addEventListener('keypress',function(e){

  if(e.key === 'Enter'){

    const query = this.value;

    window.location.href =
    `https://www.google.com/search?q=${encodeURIComponent(query)}`;
  }

});

function createHeart(){

  const heart = document.createElement('div');

  heart.classList.add('heart');

  heart.innerHTML = '❤';

  heart.style.left = Math.random() * 100 + 'vw';

  heart.style.animationDuration =
  (5 + Math.random() * 5) + 's';

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },10000);
}

setInterval(createHeart,400);

function createButterfly(){

  const butterfly = document.createElement('div');

  butterfly.classList.add('butterfly');

  butterfly.innerHTML = '🦋';

  butterfly.style.top =
  Math.random() * 80 + 'vh';

  butterfly.style.animationDuration =
  (12 + Math.random() * 8) + 's';

  document.body.appendChild(butterfly);

  setTimeout(()=>{
    butterfly.remove();
  },20000);
}

setInterval(createButterfly,3000);

</script>

</body>
</html>
